name: Validate LocGuard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show actual toolchain version
        run: moon version --all
      - name: Test library and CLI argument handling
        run: moon test --target js
      - name: Verify library on WebAssembly GC
        run: moon test --target wasm-gc
      - name: Test real CLI behavior
        run: node scripts/smoke.mjs
